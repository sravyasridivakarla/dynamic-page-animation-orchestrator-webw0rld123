services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/backend"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/backend"
      KG_SERVICE_URL: "${KG_SERVICE_URL:-http://kg-service:8001}"
      PROVENANCE_URL: "${PROVENANCE_URL:-http://provenance-service:8002}"
      APP_ENV: "${APP_ENV:-development}"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
